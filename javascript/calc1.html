<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head><title>calc</title></head>
    <style>
#d{
    text-align: center;
    background-color: aliceblue;
    margin-right: 600px;
    margin-left: 600px;
    margin-top: 60px;
    border-radius: 40px;
}

    </style>
  
            
                <body style="background-color: blueviolet;">
                    <section class="box"></section>
                    <form id="cal">
                      
                      
                    <div id="d">
                        <h1 style="color: blueviolet; background-color: rgb(39, 39, 39);border-radius: 100px;">CALCULATOR</h1>
                        <div id="ph">
                        <input type="number" id="num1" placeholder="first number">
                        <br>
                        <br>
                        <input type="number" id="num2" placeholder="secondnumber">
                        </div>
                        <br>
                        <br>
                        <button type="button" onclick="sum()">+ </button>
                        
                        
                        <button type="button"  onclick="sub()">-</button>
                        
            
                        <button type="button" onclick="multiply()">*</button>
                        
                        <button type="button" onclick="divi()">/</button>
                        <br><br>
                        <h2 id="result">result:</h2>
                    
                    </div>
                    </form>
                </section>
                    <script>
                        function sum()
                           
                            {var num1 = +document.getElementById("num1").value;
                            var num2 = +document.getElementById("num2").value;
                            document.getElementById(`result`).innerHTML= `result: ${num1+num2}`  ;
                           }
                        
                            function sub()
                            {var num1 = +document.getElementById("num1").value;
                            var num2 = +document.getElementById("num2").value;
                            document.getElementById(`result`).innerHTML= `result: ${num1-num2}`  ;}

                            function multiply()
                            {var num1 = +document.getElementById("num1").value;
                            var num2 = +document.getElementById("num2").value;
                            document.getElementById(`result`).innerHTML= `result: ${num1*num2}`  ;}
                            function divi()
                            {var num1 = +document.getElementById("num1").value;
                            var num2 = +document.getElementById("num2").value;
                            document.getElementById(`result`).innerHTML= `result: ${num1/num2}`  ;}
                        
                    </script>
                </body>
            </html>
        </form>
    </body>
</html>
