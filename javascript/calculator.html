<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Basic Calculator</title>
        <style>
            body{
                background-color: black;
                justify-content: center;
                text-align: center;
            }
            h1{
                color: lightblue;
                font-size: 50px;
                
            }
            button{
                background-color: black;
                color: white;
                font-size: 20px;
            }
            input{
                background-color: black;
                color: white;
                font-size: 20px;
            }
        </style>
        
        
        
    </head>
    <body>
        <h1>Basic Calculator</h1>
        <input type="number" id="num1" placeholder="first number"><br><br>
        <input type="number" id="num2" placeholder="second number"><br><br>
        <button type="button" onclick="calculate('+')">Add</button>
        <button type="button" onclick="calculate('-')"> Sub</button>
        <button type="button" onclick="calculate('*')"> mul</button>
        <button type="button" onclick="calculate('/')"> div</button><br> <br>
        <button type="button" onclick="calculate('**')"> power</button>
        <button type="button" onclick="calculate('%')"> mod</button>
        <button type="button" onclick="calculate('xx')"> sqrt</button>
        <h1 id="result"></h1>
    
        
       <script>
        function calculate(operator){
            const num1=parseFloat(document.getElementById('num1').value);
            const num2=parseFloat(document.getElementById('num2').value);
            
            if (isNaN(num1) || isNaN(num2)){
            document.getElementById('result').innerText="Error: please enter valid number";
            return;
            }
        
        let result;
        if(operator==='+'){
            result=num1+num2;
        }
        else if(operator==='-'){
            result=num1-num2;
        }
            
        else if(operator==='*'){
            result=num1*num2;
        }
        else if(operator==='/'){
            result=num1/num2;
        }
        else if(operator==='**'){
            result=num1**num2;
        }
        else if(operator==='%'){
            result=num1%num2;
        }
        else if(operator==='xx'){
            result=Math.sqrt(num1);
        }
        
        else{
            result="Invalid operator";
            document.getElementById('result').innerText="Error: please enter valid operator";
        }
        document.getElementById('result').innerText=`result :${result}`;
    
    }   
        


       </script>
    </body>
</html>
