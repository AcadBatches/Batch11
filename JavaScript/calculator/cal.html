<!DOCTYPE html>
<html lang="en">
<head>
<title>Calculator</title>
<style>
    .c1{
        background-color: rgb(38, 173, 226);
        color: white;
        text-align: center;
        padding-top: 15px;
        height: 120px;
        width: 500px;
        align-items: center;
        margin-left: 450px;
    }
    button{
        background-color: rgb(123, 10, 199);
        color: white;    
        margin: 5px;    
        display: flex-row;
    }
    h1{
        color: rgb(10, 186, 230);
        text-align: center;
        font-size: 50px;
    }
    body{
        background-color: rgb(24, 22, 119);
   
    }

</style>
</head>
<body>
    <h1>Calculator</h1>
    <DIV class="c1">
        <form>
            <input type="number" id="num1" placeholder="First Number">
            <input type="number" id="num2" placeholder="Second Number">
            <br>
            <br>
            <button type="button" onclick="Add()">ADD</button>
            <button type="button" onclick="Sub()">SUB</button>
            <button type="button" onclick="Multiple()">MULTIPLE</button>
            <button type="button" onclick="Division()">DIVISION</button>
            <h2 id="result"></h2>
        </form>
        </DIV>
        <script>
            function Add() {
                var num1 = +document.getElementById('num1').value;
                var num2 = +document.getElementById('num2').value;
                document.getElementById('result').innerHTML =`Result : ${num1+num2}`;
            }

            function Sub() {
                var num1 = +document.getElementById('num1').value;
                var num2 = +document.getElementById('num2').value;
                document.getElementById('result').innerHTML =`Result : ${num1-num2}`;
            }

            function Multiple() {
                var num1 = +document.getElementById('num1').value;
                var num2 = +document.getElementById('num2').value;
                document.getElementById('result').innerHTML =`Result : ${num1*num2}`;
            }

            function Division() {
                var num1 = +document.getElementById('num1').value;
                var num2 = +document.getElementById('num2').value;
                document.getElementById('result').innerHTML =`Result : ${num1/num2}`;
            }
        </script>
</body>
</html>
