<html>
<head>
<title>Condition Statement</title>
<style>
    .c1{
        background-color: rgb(201, 204, 10);
        color: rgb(97, 107, 5);
        text-align: center;
        padding-top: 15px;
        height: 150px;
        width: 500px;
        font-size: 20px;
        align-items: center;
        margin-left: 450px;
    }
    button{
        background-color: rgb(250, 235, 25);
        color: rgb(90, 121, 179);    
        margin: 5px;    
        display: flex-row;
        font-size: 20px;
    }
    h1{
        color: rgb(97, 107, 5);
        text-align: center;
        font-size: 50px;
    }
    body{
        background-color: rgb(216, 213, 63);
   
    }
    input   {
        font-size: 18px;
    }

</style>
</head>
<body>
    <h1>Calculator</h1>
    <DIV class="c1">
        <form>
            <input type="number" id="num1" placeholder="First Number">
            <input type="number" id="num2" placeholder="Second Number">
            <br>
            <br>
           <button type="button" onclick="calculate('add')">Addition</button>
           <button type="button" onclick="calculate('subtract')">Subtraction</button>
           <button type="button" onclick="calculate('multiply')">Multiplication</button>
           <button type="button" onclick="calculate('divide')">Division</button>
           <button type="button" onclick="calculate('modulus')">Modulus</button>
           <button type="button" onclick="calculate('square')">Square</button>
        </form> 
        <h3>Result: <span id="result">---</span></h3>
        </DIV>
        <script>
            function calculate(operation) {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let result;

            if (operation === 'add') {
                result = num1 + num2;
            } else if (operation === 'subtract') {
                result = num1 - num2;
            } else if (operation === 'multiply') {
                result = num1 * num2;
            } else if (operation === 'divide') {
                    result = num1 / num2;
            } else if (operation === 'modulus') {
                result = num1 % num2;
            } else {
                result = 'Invalid operation';
            }

            document.getElementById('result').innerText = result;
        }
        </script>
</body>
</html>
