<html>
<title>calulator</title>
<style>
 
 #cal {

color: rgb(74, 19, 202);
text-align: center;
position: sticky;


 }
 #d {
    background-color: aqua;
    position: sticky;
 }
 #onecontainer {
    background-color: rgb(8, 242, 59);
    margin: 90px;
    margin-left: 300px;
    margin-right: 300px;
    border-radius: 50px;
    position: sticky;
   
 }






</style>

<body id="d">
    <div id="onecontainer">
<div>
<h1 style="color: rgb(205, 17, 17); text-align: center;padding: 40px;">Caluclator program</h1>
<form id="cal">
    <input type="number" id="num1" placeholder="Enter number 1"><br><br>
    <input type="number" id="num2" placeholder="Enter number 2"><br><br>
    <button type="button" onclick="add() " >add</button><br><br>
    <button type="button" onclick="sub() " >sub</button><br><br>
    <button type="button" onclick="mul() " >mul</button><br><br>
    <button type="button" onclick="div() " >div</button><br><br>
    <h2 id="result"></h2><br><br>
</div>
</div>

    </form>
<script>
 function add()
{

var  num1= +document.getElementById("num1").value ;
var  num2= +document.getElementById("num2").value ;
document.getElementById("result").innerHTML=`result: ${num1+num2}`;




}
function  sub()
{
    var  num1= +document.getElementById("num1").value ;
    var  num2= +document.getElementById("num2").value ;
    document.getElementById("result").innerHTML=`result: ${num1-num2}`
}
function mul()
{
    var  num1= +document.getElementById("num1").value ;
    var  num2= +document.getElementById("num2").value ;
    document.getElementById("result").innerHTML=`result: ${num1*num2}`

}

 function div()
 {
    var  num1= +document.getElementById("num1").value ;
    var  num2= +document.getElementById("num2").value ;
    document.getElementById("result").innerHTML=`result: ${num1/num2}`
 }


</script>


</body>

</html>
